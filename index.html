<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Min första hemsida</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: #f5f4f0;
            color: #202c29;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            line-height: 1.6;
        }

        main {
            max-width: 1000px;
            margin: 0 auto;
            padding: 32px 24px 64px;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 16px;
            padding-bottom: 28px;
            font-size: 0.9rem;
        }

        .logo {
            font-weight: 750;
            letter-spacing: -0.03em;
        }

        .status {
            color: #466257;
        }

        .hero {
            padding: clamp(32px, 7vw, 72px);
            border: 1px solid #d8e3db;
            border-radius: 28px;
            background: linear-gradient(135deg, #e7efe7, #f0f3e6);
        }

        .eyebrow {
            margin: 0 0 20px;
            color: #466257;
            font-size: 0.75rem;
            font-weight: 700;
            letter-spacing: 0.12em;
            text-transform: uppercase;
        }

        h1 {
            max-width: 700px;
            margin: 0;
            font-size: clamp(2.5rem, 6vw, 4.5rem);
            line-height: 1.08;
            letter-spacing: -0.055em;
        }

        .intro {
            max-width: 460px;
            margin: 24px 0 32px;
            color: #53645c;
            font-size: 1.15rem;
        }

        button {
            padding: 14px 22px;
            border: 0;
            border-radius: 12px;
            background: #254f3d;
            color: #fff;
            font: inherit;
            font-weight: 600;
            cursor: pointer;
            transition: background 150ms ease;
        }

        button:hover {
            background: #183b2b;
        }

        button:focus-visible {
            outline: 3px solid #254f3d;
            outline-offset: 4px;
        }

        .projects {
            margin-top: 48px;
        }

        h2 {
            margin: 0 0 16px;
            font-size: 1.6rem;
            letter-spacing: -0.035em;
        }

        .project-card {
            padding: 28px;
            border: 1px solid #e2e4dc;
            border-radius: 20px;
            background: #fff;
        }

        .project-card p {
            margin: 12px 0 0;
            color: #53645c;
        }

        .badge {
            display: inline-block;
            padding: 5px 10px;
            border-radius: 6px;
            background: #f0f3eb;
            color: #466257;
            font-size: 0.75rem;
            font-weight: 600;
        }

        footer {
            margin-top: 32px;
            color: #53645c;
            font-size: 0.8rem;
        }

        @media (max-width: 480px) {
            main {
                padding: 24px 16px 40px;
            }

            header {
                flex-wrap: wrap;
            }

            .hero {
                padding: 32px 24px;
                border-radius: 20px;
            }
        }
    </style>
</head>
<body>
    <main>
        <header>
            <span class="logo">William.</span>
            <span class="status">Nyfiken. Lärande. Skapande.</span>
        </header>

        <section class="hero" aria-labelledby="intro-heading">
            <p class="eyebrow">Välkommen till min lilla del av internet</p>
            <h1 id="intro-heading">Hej! Jag heter William 🚀</h1>
            <p class="intro">Jag lär mig att bygga hemsidor och AI-projekt.</p>
            <button type="button" onclick="visaMeddelande()">Klicka på mig! <span aria-hidden="true">↗</span></button>
        </section>

        <section class="projects" aria-labelledby="projects-heading">
            <h2 id="projects-heading">Mina projekt</h2>
            <div class="project-card">
                <span class="badge">Under utveckling</span>
                <p>Här kommer jag lägga upp saker jag bygger.</p>
            </div>
        </section>

        <footer>Byggt med nyfikenhet &amp; lite JavaScript.</footer>
    </main>
    <script>
        function visaMeddelande() {
            alert("Du har precis kört JavaScript! 🚀");
        }
    </script>
</body>
</html>
